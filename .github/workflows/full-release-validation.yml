# FORK-ONLY DIAGNOSTIC: replaces the registered path only on a temporary branch.
# This is not Full Release Validation or publication-admissible release evidence.
name: PR 165917 native candidate image diagnostic
run-name: PR 165917 image diagnostic ${{ inputs.evidence_kind }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable build-source commit (no tag creation)
        required: true
        default: 530dd481918621f73f3a574a6054a85905c1ff81
        type: string
      tag:
        description: Version-identity input matching source package.json; no tag is created
        required: true
        default: v2026.9.9
        type: string
      evidence_kind:
        description: Keep historical-source evidence separate from final-candidate proof
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - historical-source

permissions:
  contents: read
  actions: read

jobs:
  input_binding:
    if: github.repository == 'Conan-Scott/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse unresolved or mismatched diagnostic source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          CANDIDATE_SHA: 530dd481918621f73f3a574a6054a85905c1ff81
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$EVIDENCE_KIND" == candidate ]]; then
            test "$SOURCE_SHA" = "$CANDIDATE_SHA"
          elif [[ "$EVIDENCE_KIND" == historical-source ]]; then
            test "$SOURCE_SHA" != "$CANDIDATE_SHA"
          else
            exit 1
          fi

  correction_source_checks:
    needs: input_binding
    if: inputs.evidence_kind == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK_MODE: throttled
      NPM_CONFIG_ALLOW_REMOTE: all
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned source dependencies
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate corrected consumer closures and retained runtime contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/correction-proof"
          pnpm test src/cli/plugins-control-ui-build.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/correction-proof/cli-boundaries.log"
          pnpm test test/scripts/build-all.test.ts test/scripts/runtime-postbuild.test.ts test/scripts/plugin-publication-artifact.test.ts test/scripts/artifact-permissions.test.ts test/scripts/check-artifact-permissions.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/correction-proof/root-boundaries.log"
          pnpm test test/scripts/docker-release-artifacts.test.ts test/scripts/full-release-artifacts.test.ts test/scripts/release-ci-summary.qualification.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/correction-proof/recovery-owners.log"
          pnpm test test/scripts/package-acceptance-workflow.test.ts -t 'shards broad native live tests instead of one serial live-all job' --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/correction-proof/workflow-owner.log"
          pnpm plugins:assets:check 2>&1 | tee "$RUNNER_TEMP/correction-proof/generated-assets.log"
          node scripts/run-tsgo.mjs -p tsconfig.core.json --incremental 2>&1 | tee "$RUNNER_TEMP/correction-proof/core-types.log"
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.config-cli.json --incremental 2>&1 | tee "$RUNNER_TEMP/correction-proof/cli-types.log"
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.scripts.json --incremental 2>&1 | tee "$RUNNER_TEMP/correction-proof/root-types.log"
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/cli/plugins-control-ui-build.ts src/cli/plugins-control-ui-build.test.ts 2>&1 | tee "$RUNNER_TEMP/correction-proof/cli-lint.log"
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/scripts/package-acceptance-workflow.test.ts test/scripts/full-release-artifacts.test.ts test/scripts/candidate-publication.test-support.ts 2>&1 | tee "$RUNNER_TEMP/correction-proof/root-lint.log"
          pnpm exec oxfmt --check src/cli/plugins-control-ui-build.ts src/cli/plugins-control-ui-build.test.ts test/scripts/package-acceptance-workflow.test.ts test/scripts/full-release-artifacts.test.ts test/scripts/candidate-publication.test-support.ts extensions/workboard/openclaw.plugin.json
          git diff --exit-code
      - name: Preserve focused correction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-correction-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/correction-proof/*.log
          if-no-files-found: error

  prepare:
    needs: [input_binding, correction_source_checks]
    if: ${{ !cancelled() && needs.input_binding.result == 'success' && (inputs.evidence_kind == 'historical-source' || needs.correction_source_checks.result == 'success') }}
    uses: ./.github/workflows/docker-release-prepare.yml
    with:
      tag: ${{ inputs.tag }}
      release_sha: ${{ inputs.source_sha }}
      image_tag_suffix: ""
