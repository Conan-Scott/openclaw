# FORK-ONLY DIAGNOSTIC: replaces the registered path only on a temporary branch.
# This is not Full Release Validation or publication-admissible release evidence.
name: PR 165917 native candidate image diagnostic
run-name: PR 165917 image diagnostic ${{ inputs.evidence_kind }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable build-source commit (no tag creation)
        required: true
        default: 087b3d1d731786799a28554798b22798b7b43c49
        type: string
      tag:
        description: Version-identity input matching source package.json; no tag is created
        required: true
        default: v2026.9.8
        type: string
      evidence_kind:
        description: Keep historical-source evidence separate from final-candidate proof
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - historical-source

permissions:
  contents: read
  actions: read

jobs:
  input_binding:
    if: github.repository == 'Conan-Scott/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse unresolved or mismatched diagnostic source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          CANDIDATE_SHA: 087b3d1d731786799a28554798b22798b7b43c49
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$EVIDENCE_KIND" == candidate ]]; then
            test "$SOURCE_SHA" = "$CANDIDATE_SHA"
          elif [[ "$EVIDENCE_KIND" == historical-source ]]; then
            test "$SOURCE_SHA" != "$CANDIDATE_SHA"
          else
            exit 1
          fi

  correction_source_checks:
    needs: input_binding
    if: inputs.evidence_kind == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK_MODE: throttled
      NPM_CONFIG_ALLOW_REMOTE: all
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pinned source dependencies
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin 773ad2b837acc4ce3913e4ab7ff6953ce694b3c9
          corepack enable
          pnpm install --frozen-lockfile
      - name: Prove original projection red and corrected owner green
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/correction-proof"
          cp Dockerfile "$RUNNER_TEMP/correction-proof/final.Dockerfile"
          trap 'cp "$RUNNER_TEMP/correction-proof/final.Dockerfile" Dockerfile' EXIT
          # Prior three producer regressions and unchanged owner gates retain their
          # exact 773 source evidence; this head changes only Docker metadata/test.
          git show 773ad2b837acc4ce3913e4ab7ff6953ce694b3c9:Dockerfile > Dockerfile
          set +e
          node scripts/run-vitest.mjs src/dockerfile.test.ts -t 'assembles built assets onto production dependencies' --maxWorkers=1 > "$RUNNER_TEMP/correction-proof/original-metadata-red.log" 2>&1
          metadata_red_status=$?
          set -e
          cat "$RUNNER_TEMP/correction-proof/original-metadata-red.log"
          test "$metadata_red_status" -ne 0
          grep -F 'Artifact is not world-readable (0600)' "$RUNNER_TEMP/correction-proof/original-metadata-red.log"
          grep -F '.pnpm-workspace-state-v1.json' "$RUNNER_TEMP/correction-proof/original-metadata-red.log"
          cp "$RUNNER_TEMP/correction-proof/final.Dockerfile" Dockerfile
          # Existing synthetic closeout fixture hardcodes the upstream repository.
          # Isolate that unit-test process only; real image/release contexts are unchanged.
          env GITHUB_REPOSITORY=openclaw/openclaw node scripts/run-vitest.mjs src/plugins/prune-docker-plugin-dist.test.ts test/scripts/prune-docker-plugin-dist.test.ts src/dockerfile.test.ts test/scripts/docker-release-artifacts.test.ts test/scripts/verify-stable-main-closeout.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/correction-proof/owning-tests.log"
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.other.json --incremental 2>&1 | tee "$RUNNER_TEMP/correction-proof/docker-types.log"
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.core.test.other.json src/dockerfile.test.ts 2>&1 | tee "$RUNNER_TEMP/correction-proof/docker-lint.log"
          pnpm exec oxfmt --check src/dockerfile.test.ts
          git diff --exit-code
      - name: Preserve focused correction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-correction-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/correction-proof/*.log
          if-no-files-found: error

  prepare:
    needs: [input_binding, correction_source_checks]
    if: ${{ !cancelled() && needs.input_binding.result == 'success' && (inputs.evidence_kind == 'historical-source' || needs.correction_source_checks.result == 'success') }}
    uses: ./.github/workflows/docker-release-prepare.yml
    with:
      tag: ${{ inputs.tag }}
      release_sha: ${{ inputs.source_sha }}
      image_tag_suffix: ""
