# FORK-ONLY DIAGNOSTIC: replaces the registered path only on a temporary branch.
# This is not Full Release Validation or publication-admissible release evidence.
name: PR 165917 native candidate image diagnostic
run-name: PR 165917 image diagnostic ${{ inputs.evidence_kind }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable build-source commit (no tag creation)
        required: true
        default: 7a3aa855e474841bdbe93cba8f50265b9aaf33df
        type: string
      tag:
        description: Version-identity input matching source package.json; no tag is created
        required: true
        default: v2026.9.8
        type: string
      evidence_kind:
        description: Keep historical-source evidence separate from final-candidate proof
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - historical-source

permissions:
  contents: read
  actions: read

jobs:
  input_binding:
    if: github.repository == 'Conan-Scott/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse unresolved or mismatched diagnostic source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          CANDIDATE_SHA: 7a3aa855e474841bdbe93cba8f50265b9aaf33df
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$EVIDENCE_KIND" == candidate ]]; then
            test "$SOURCE_SHA" = "$CANDIDATE_SHA"
          elif [[ "$EVIDENCE_KIND" == historical-source ]]; then
            test "$SOURCE_SHA" != "$CANDIDATE_SHA"
          else
            exit 1
          fi

  prepare:
    needs: input_binding
    uses: ./.github/workflows/docker-release-prepare.yml
    with:
      tag: ${{ inputs.tag }}
      release_sha: ${{ inputs.source_sha }}
      image_tag_suffix: ""
